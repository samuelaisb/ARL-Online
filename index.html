    <!-- Boot card (sleeping Kimchi), shown only if the bundle is slow to mount: it
         appears in one step after 450ms, no fade.
         Inline on purpose: it must be styled before app.css exists (also in dev).
         It hides itself the frame Svelte mounts into #app; no script involved.
         Its text follows <html lang> (set per request by the server) with CSS only,
         since the CSP allows inline scripts only by hash. -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #faf9f7;
        opacity: 0;
        animation: boot-in 0s 450ms forwards;
      }
      #app:not(:empty) + .boot {
        display: none;
      }
      .boot__cat {
        display: block;
        width: 3.5rem;
        height: 3.5rem;
        border: 3px solid #ffffff;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 4px 14px rgba(35, 31, 32, 0.12), 0 0 0 6px rgba(255, 221, 42, 0.25);
        animation: boot-breathe 2.6s ease-in-out infinite;
      }
      .boot__dots {
        display: flex;
        align-items: flex-end;
        gap: 0.38rem;
        height: 1rem;
        font-size: 1.6rem;
      }
      .boot__dots span {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: #024238;
        opacity: 0.5;
        animation: boot-hop 1.1s cubic-bezier(0.34, 1.3, 0.64, 1) infinite;
      }
      .boot__dots span:nth-child(2) {
        animation-delay: 120ms;
      }
      .boot__dots span:nth-child(3) {
        animation-delay: 240ms;
      }
      /* System fonts: Inter isn't loaded yet. */
      .boot__text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.9375rem;
        line-height: 1.4;
        color: #5c5658;
      }
      .boot__text--fr {
        display: none;
      }
      :lang(fr) .boot__text--en {
        display: none;
      }
      :lang(fr) .boot__text--fr {
        display: inline;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes boot-hop {
        0%,
        55%,
        100% {
          transform: none;
          opacity: 0.5;
        }
        22% {
          transform: translateY(-0.25em);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__cat,
        .boot__dots span {
          animation: none;
        }
        .boot__dots span:nth-child(2) {
          opacity: 0.75;
        }
        .boot__dots span:nth-child(3) {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="boot" role="status">
      <img class="boot__cat" src="/content/kimchi-sleep.jpg" width="56" height="56" alt="" />
      <span class="boot__dots" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="boot__text boot__text--en">Waking up…</span><span class="boot__text boot__text--fr">On se réveille…</span>
    </div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
